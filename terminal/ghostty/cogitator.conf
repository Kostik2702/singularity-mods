# Cogitator: Ghostty as an amber data-slate of the Imperium, to match the mission-control
# `warhammer` theme and the Claude Code theme «Когитатор».
#
# Installed by `node tools/install.mjs`: it writes a marked block into the Ghostty config
# that sets the shader and the aquila by this repo's absolute paths and includes this
# file. `node tools/install.mjs --uninstall` removes the block.
# It applies to every Ghostty window: Ghostty has no per-window profile.

# Glass and phosphor
background = #0e0a05
foreground = #f2b04a
cursor-color = #ffd27a
cursor-text = #0e0a05
selection-background = #5a3f12
selection-foreground = #ffe0a0
bold-is-bright = false

# The sixteen inks: amber for the neutrals, scarlet, olive phosphor, cobalt and violet
# toned to the glass, so ls, git and diffs still tell their colours apart.
palette = 0=#0e0a05
palette = 1=#e8452f
palette = 2=#a5b84e
palette = 3=#ffbf4d
palette = 4=#6b93c9
palette = 5=#ab84c4
palette = 6=#8fb8a0
palette = 7=#e09a2e
palette = 8=#5a4220
palette = 9=#ff6a4d
palette = 10=#c4d65a
palette = 11=#ffd27a
palette = 12=#8fb0e0
palette = 13=#c8a0e0
palette = 14=#b0d8c0
palette = 15=#fff0c8

# The aquila, faint, in the lower right of the glass (the image path: set by the installer)
background-image-opacity = 0.10
background-image-position = bottom-right
background-image-fit = none
background-image-repeat = false

# The display and its brass housing: the shader paths and custom-shader-animation are
# set by the installer (static by default; `--animated` adds cogitator-live.glsl).

# Room around the glass for the shader's brass housing (it draws in this padding)
window-padding-x = 34
window-padding-y = 30
window-padding-balance = true
window-padding-color = background

# A dark window frame around the housing
window-theme = dark
